[project]
name = "inspector-lotes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "focab0r", email = "focab0r@proton.me" }
]
requires-python = ">=3.13"
dependencies = [
    "joblib>=1.6.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pydantic>=2.14.0",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[project.scripts]
inspector-lotes = "inspector_lotes:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
